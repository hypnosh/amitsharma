{{ define "main" }}

  <p>You found the random button.<br/>Let's see where it takes you...</p>

    <script>
    const posts = [
        {{ range .Site.Data.random.posts }}
        "{{ .url }}?utm_source=redirect&utm_medium=r-random&utm_campaign=random",
        {{ end }}
    ];

    const randomPost =
        posts[Math.floor(Math.random() * posts.length)];

    window.location.replace(randomPost);
    </script>

{{ end }}
