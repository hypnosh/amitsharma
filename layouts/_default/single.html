{{ define "main" }}

<article class="page">

    <header class="page-header">

        <h1>{{ .Title }}</h1>

        {{ with .Description }}
        <p class="page-description">
            {{ . }}
        </p>
        {{ end }}

    </header>

    <div class="page-content">
        {{ .Content }}
    </div>

    {{ if .Params.showTestimonials }}
        {{ partial "testimonials.html" . }}
    {{ end }}

</article>

{{ end }}
