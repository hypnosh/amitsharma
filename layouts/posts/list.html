{{ define "main" }}

<article class="page">

    <header class="page-header">
        <h1>{{ .Title }}</h1>

        {{ with .Description }}
        <p class="page-description">
            {{ . }}
        </p>
        {{ end }}
    </header>

    <div class="posts-list">

        {{ range .Pages.ByDate.Reverse }}

        <article class="post-preview">

            <h2>
                <a href="{{ .RelPermalink }}">
                    {{ .Title }}
                </a>
            </h2>

            <p class="post-date">
                {{ .Date.Format "2 January 2006" }}
            </p>

            {{ with .Description }}
            <p class="post-description">
                {{ . }}
            </p>
            {{ else }}
            <p class="post-description">
                {{ .Summary }}
            </p>
            {{ end }}

        </article>

        {{ end }}

    </div>

</article>

{{ end }}
